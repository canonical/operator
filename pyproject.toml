[project]
name = "ops"
description = "The Python library behind great charms"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name="The Charm Tech team at Canonical Ltd."},
]
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "PyYAML==6.*",
    "websocket-client==1.*",
    # Wide version range to preempt conflicts when charms pin a version.
    "opentelemetry-api~=1.0",
]
dynamic = ["version"]

[project.optional-dependencies]
testing = [
    "ops-scenario==8.9.0.dev0",
]
tracing = [
    "ops-tracing==3.9.0.dev0",
]
# Empty for now, because Harness is bundled with the base install, but allow
# specifying the extra to ease transition later.
harness = []

[dependency-groups]
lint = [
    "ruff==0.16.0",
    "codespell==2.4.2",
    "zizmor==1.28.0",
    "ops[testing,tracing]",
    "pyright~=1.1",
    "typing_extensions~=4.2",
]
mypy = [  # used to type check example charms in CI
    "mypy>=1.19",
    "types-PyYAML",
]
unit = [
    "ops[testing,tracing]",
    "pytest~=9.0",
    "pydantic~=2.10",
]
xdist = [
    "pytest-xdist~=3.6",
]
coverage = [
    "coverage[toml]~=7.0",
]
benchmark = [
    "pytest-benchmark~=5.0",
]
integration = [
    "ops[testing,tracing]",
    "pytest~=9.0",
    "jubilant~=1.5",
    "jubilant-backports",
    "minio~=7.2",
    "httpx~=0.28",
]
release = [
    "packaging>=24,<27",
    "pygithub~=2.6",
    "rich>=14.1,<16.0",
]
tiobe = [
    "flake8==7.3.0",
    "pylint==4.0.6",
]

[project.urls]
"Homepage" = "https://canonical.com/juju/docs/ops/latest/"
"Repository" = "https://github.com/canonical/operator"
"Issues" = "https://github.com/canonical/operator/issues"
"Documentation" = "https://canonical.com/juju/docs/ops/latest/"
"Changelog" = "https://github.com/canonical/operator/blob/main/CHANGES.md"

[build-system]
requires = [
    "setuptools>=60",
]
build-backend = "setuptools.build_meta"

[tool.uv.workspace]
members = ["tracing", "testing"]

[tool.uv.sources]
ops = { workspace = true }
ops-scenario = { workspace = true }
ops-tracing = { workspace = true }

[tool.setuptools.packages.find]
include = ["ops", "ops._private", "ops.hookcmds", "ops.lib"]

[tool.setuptools.dynamic]
version = {attr = "ops.version.version"}

# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

# Formatting tools configuration
[tool.autopep8]
max-line-length = 99
ignore = ["W503"]
recursive = true
jobs = -1
aggressive = 3

# Linting tools configuration
[tool.ruff]
line-length = 99
exclude = ["examples"]
target-version = "py310"
extend-exclude = ["docs/conf.py", "docs/_dev/", "docs/tutorial/"]

# Ruff formatter configuration
[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "unsorted-imports",
    # pep8-naming
    "N",
    # flake8-builtins
    "A",
    # flake8-copyright
    "CPY",
    # pyupgrade
    "UP",
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # Ruff specific
    "RUF",
    # Perflint
    "PERF",
    # pyflakes-docstrings
    "D",
    # flake8-future-annotations
    "FA",
    # flake8-type-checking
    "TC",
]
ignore = [
    "typing-only-first-party-import",
    "typing-only-third-party-import",
    "typing-only-standard-library-import",
    "assert",
    "assert-false",
    "suspicious-pickle-import",
    "suspicious-subprocess-import",

    "no-explicit-stacklevel",

    # We prefer the readability of returning the condition explicitly.
    "needless-bool",
    "suppressible-exception",
    "multiple-with-statements",

    "undocumented-magic-method",
    "undocumented-public-init",

    "manual-list-comprehension",
    "manual-dict-comprehension",

    # Since we have some `TypedDict`s that cannot use the class syntax, we're
    # currently choosing to be consistent in syntax even though some can be
    # moved to the class syntax.
    "convert-typed-dict-functional-to-class",

    ## Likely worth doing, but later.

    "subprocess-without-shell-equals-true",
]
exclude = ["tracing/ops_tracing/vendor/*"]

[tool.ruff.lint.per-file-ignores]
"test/*" = [
    # All documentation linting.
    "D",

    "hardcoded-password-string",
    "hardcoded-password-func-arg",

    "useless-expression",

    # Tests check round-tripped exact-literal config values; pytest.approx
    # isn't appropriate here.
    "float-equality-comparison",
]
"testing/tests/*" = [
    # All documentation linting.
    "D",
]
"testing/src/scenario/_charmcraft_extensions.py" = [
    "line-too-long",  # Auto-generated file; long description strings are unavoidable.
]
".github/generate_charmcraft_extensions.py" = [
    "start-process-with-partial-path",  # Intentionally calls charmcraft/tox by name.
]
"ops/_private/timeconv.py" = [
    # `µ` (MICRO SIGN) rather than `μ` (GREEK SMALL LETTER MU).
    "ambiguous-unicode-character-string",
    "ambiguous-unicode-character-docstring",
]
"ops/__init__.py" = [
    "non-empty-init-module",  # Wraps main() and imports ops_tracing at the bottom.
]
"ops/_private/__init__.py" = [
    "non-empty-init-module",  # Exposes a module-level tracer.
]
"ops/lib/__init__.py" = [
    "non-empty-init-module",  # Legacy library loader.
]
"test/test_helpers.py" = [
    # Seems safe, but may be changed in the future.
    "start-process-with-a-shell",
    "start-process-with-partial-path",
]
".github/patch-charm-deps.py" = [
    "start-process-with-partial-path",
]
"docs/custom_conf.py" = [
    "undocumented-public-module",
    "undocumented-public-class",
    "undocumented-public-method",
    "undocumented-public-function",
    "multiple-leading-hashes-for-block-comment",
    "unsorted-imports",
    "ambiguous-unicode-character-comment",  # EN DASH, RIGHT SINGLE QUOTATION MARK
    "mutable-class-default",
    "printf-string-formatting",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id", "min", "map", "range", "type", "TimeoutError", "ConnectionError", "Warning", "input", "format"]

[tool.pyright]
include = ["ops/*.py", "ops/_private/*.py", "test/*.py", "test/charms/*/src/*.py", "testing/src/*.py", "testing/src/scenario/*.py", "testing/tests/*.py", "testing/tests/test_e2e/*.py"]
exclude = [
    "tracing/*",
]
extraPaths = ["testing", "tracing"]
pythonVersion = "3.10" # check no python > 3.10 features are used
pythonPlatform = "All"
typeCheckingMode = "strict"
reportIncompatibleMethodOverride = false
reportImportCycles = false
reportMissingModuleSource = false
reportPrivateUsage = false
reportUnnecessaryIsInstance = false
reportUnnecessaryComparison = false
reportUnnecessaryTypeIgnoreComment = "error"
disableBytesTypePromotions = true
stubPath = ""

[tool.codespell]
skip = './docs/_build,./docs/_dev,.venv,venv,build,examples,uv.lock'
quiet-level = 3
