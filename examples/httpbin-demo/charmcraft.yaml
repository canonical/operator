type: charm
base: ubuntu@24.04
platforms:
  amd64:
  arm64:

name: httpbin-demo
title: |
  httpbin-demo
description: |
  A Kubernetes charm for kennethreitz/httpbin that demonstrates how to restart the workload when a configuration option changes.
summary: |
  A demo Kubernetes charm.

assumes:
  - juju >= 3.6
  - k8s-api

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv

config:
  options:
    log-level:
      description: |
        Configures the log level of gunicorn.

        Acceptable values are: "info", "debug", "warning", "error" and "critical"
      default: "info"
      type: string

containers:
  httpbin:
    resource: httpbin-image

resources:
  # An OCI image resource for the container listed above.
  httpbin-image:
    type: oci-image
    description: OCI image for httpbin
    # The upstream-source field is ignored by Charmcraft and Juju, but it can be
    # useful to developers in identifying the source of the OCI image. It is also
    # used by the 'canonical/charming-actions' GitHub action for automated releases.
    # The test_deploy function in tests/integration/test_charm.py reads upstream-source
    # to determine which OCI image to use when running the charm's integration tests.
    upstream-source: docker.io/kennethreitz/httpbin:latest
