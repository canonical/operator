name: ops Property Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * *'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv tool install tox --with tox-uv

      # Pull requests and pushes get a small, derandomised run. The scheduled
      # and manual runs get a large budget with fresh randomness, to look for
      # inputs nobody has tried yet.
      - name: Run property tests
        run: tox -e property
        env:
          HYPOTHESIS_PROFILE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'nightly' || 'ci' }}
        timeout-minutes: 60

  open-issue-on-failure-if-scheduled:
    if: ${{ failure() && github.event_name == 'schedule' }}
    needs: [test]
    permissions:
      issues: write
      actions: read  # for ai-failure-enrich.yaml
    secrets:
      # For ai-failure-enrich.yaml -- can only be read in the ai-failure-triage environment.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    uses: $/.github/workflows/notify-scheduled-failure.yaml
