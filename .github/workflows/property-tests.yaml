name: ops Property Tests

# The property tests live on the long-lived property-tests branch. This file
# gives that branch's pushes and pull requests the derandomised run.
# GitHub only schedules workflows from the default branch, so the nightly run
# is property-tests-nightly.yaml on main, which checks this branch out.
on:
  push:
    branches:
      - property-tests
  pull_request:
    branches:
      - property-tests

permissions: {}

jobs:
  property:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv tool install tox --with tox-uv

      - name: Run property tests
        run: tox -e property
        env:
          HYPOTHESIS_PROFILE: ci
        timeout-minutes: 60
