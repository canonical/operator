name: Example Charm Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  charm-checks:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
        dir:
          - examples/httpbin-demo
          - examples/machine-tinyproxy
          - examples/k8s-1-minimal
          - examples/k8s-2-configurable
          - examples/k8s-3-postgresql
          - examples/k8s-4-action
          - examples/k8s-5-observe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '${{ matrix.python-version }}'
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Set up tox and tox-uv
        run: uv tool install tox --with tox-uv
      - name: Install Charmcraft
        run: sudo snap install charmcraft --classic
      - name: Fetch any charmlibs
        run: |
          cd ${{ matrix.dir }}
          if grep -Eq "^charm-libs:" charmcraft.yaml; then
            charmcraft fetch-libs
          fi
      - name: Lock dependencies
        run: |
          cd ${{ matrix.dir }}
          uv lock
      - name: Run linting and static checks
        run: |
          cd ${{ matrix.dir }}
          tox -e lint
      - name: Run unit tests
        run: |
          cd ${{ matrix.dir }}
          tox -e unit
      - name: Write type checker requirements files
        shell: uv run --script --no-project {0}
        run: |
          # /// script
          # dependencies = ["tomli"]  # drop for tomllib when we're Python 3.11+
          # ///
          import tomli, pathlib
          pyproject_toml = tomli.loads(pathlib.Path('pyproject.toml').read_text())
          for group in ('mypy', 'pyrefly', 'ty'):
              deps = '\n'.join(pyproject_toml['dependency-groups'][group])
              print(f'{group}: {deps}')  # logging
              pathlib.Path(f'{group}-requirements.txt').write_text(deps)
      - name: Run mypy
        working-directory: ${{ matrix.dir }}
        env:
          MYPYPATH: 'src:lib:../..'
        run: |
          uv sync --group=lint --group=unit --group=integration
          uv pip install ../.. ../../testing -r ../../mypy-requirements.txt
          uv run --no-sync mypy --explicit-package-bases --follow-imports=silent src tests
      - name: Run pyrefly
        working-directory: ${{ matrix.dir }}
        run: |
          # Only some charms have a lib directory, after fetching charm libs.
          search_paths=()
          if [ -d lib ]; then search_paths+=(--search-path lib); fi
          uv sync --group=lint --group=unit --group=integration
          uv pip install ../.. ../../testing -r ../../pyrefly-requirements.txt
          uv run --no-sync pyrefly check "${search_paths[@]}" src tests
      - name: Run ty
        working-directory: ${{ matrix.dir }}
        run: |
          # Only some charms have a lib directory, after fetching charm libs.
          search_paths=()
          if [ -d lib ]; then search_paths+=(--extra-search-path lib); fi
          uv sync --group=lint --group=unit --group=integration
          uv pip install ../.. ../../testing -r ../../ty-requirements.txt
          uv run --no-sync ty check "${search_paths[@]}" src tests
