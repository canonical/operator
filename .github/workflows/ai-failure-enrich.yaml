name: AI-enrich scheduled-failure notification

# The second of two stages. The first,
# .github/workflows/notify-scheduled-failure.yaml, always creates or comments
# on a placeholder issue with no LLM involved, then calls this workflow to
# rewrite whatever it produced into a triaged, deduplicated artefact.
#
# Both stages run inside the caller's run, so the run this reads logs from is
# `github.run_id` and the workflow whose name it reports is `github.workflow`
# -- inside a reusable workflow both refer to the original caller, which is
# the scheduled workflow that failed.
#
# Keeping this in its own file, rather than as another job in the notifier,
# keeps stage 1's guarantee legible: `notify` needs no secrets, no LLM
# and no network beyond `gh`, and everything that does need them lives here.

on:
  workflow_call:
    secrets:
      # Declared, and passed by every level of the chain, even though what
      # each level passes is empty. See the OPENROUTER_API_KEY comment below.
      OPENROUTER_API_KEY:
        required: false

permissions: {}

jobs:
  enrich:
    runs-on: ubuntu-latest
    environment: ai-failure-triage
    permissions:
      issues: write
      # Reading the failing run's job logs is an `actions: read` call, and a
      # `permissions:` block sets every scope it does not name to `none`.
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - name: Extract signature, dedupe, ask the LLM, apply
        id: enrich
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}  # The workflow that failed.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Two things deliver this key, and both are load-bearing, so do
          # not tidy either away:
          #
          #   - `environment:` on this job, which is what holds the real
          #     value. No caller can see it: a job without an `environment:`
          #     resolves `secrets.OPENROUTER_API_KEY` to an empty string.
          #   - the chain naming the secret at every call site, which passes
          #     precisely that empty string, and declaring it here.
          #
          # Drop the second and this arrives empty despite the first. Fork
          # runs: 32681905277 names it and gets the key, 32682872399 does not
          # and gets nothing, 32682645113 shows the caller holding 0 while
          # this job holds the real length. That is measured rather than
          # documented, so treat a silent loss of enrichment as a suspect
          # here first.
          #
          # Each repo adopting this provisions its own. Absent key -> the
          # script uses the plain fallback body without calling OpenRouter
          # (see scripts/ai_failure_notifier.py main()).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: uv run scripts/ai_failure_notifier.py
