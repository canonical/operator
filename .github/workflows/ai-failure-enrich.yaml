name: AI-enrich scheduled-failure notification

# The second of two stages. The first,
# .github/workflows/notify-scheduled-failure.yaml, always creates or comments
# on a placeholder issue with no LLM involved, then calls this workflow to
# rewrite whatever it produced into a triaged, deduplicated artefact.
#
# Both stages run inside the caller's run, so the run this reads logs from is
# `github.run_id` and the workflow whose name it reports is `github.workflow`
# -- inside a reusable workflow both refer to the original caller, which is
# the scheduled workflow that failed.
#
# Keeping this in its own file, rather than as another job in the notifier,
# keeps stage 1's guarantee legible: `open-issue` needs no secrets, no LLM
# and no network beyond `gh`, and everything that does need them lives here.

on:
  workflow_call:

permissions: {}

jobs:
  enrich:
    runs-on: ubuntu-latest
    environment: ai-failure-triage
    permissions:
      issues: write
    outputs:
      handled: ${{ steps.enrich.outputs.handled }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - name: Extract signature, dedupe, ask the LLM, apply
        id: enrich
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}  # The workflow that failed.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Secret and variable come from the `ai-failure-triage`
          # environment, scoped to this workflow so the OpenRouter key is not
          # readable by anything else in the repo. Each repo adopting this
          # provisions its own. Absent key -> the script uses the plain
          # fallback body without calling OpenRouter (see
          # ai_failure_notifier.py main()).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: uv run .github/ai_failure_notifier.py

  # Last-resort fallback, so a failure notification is never lost. The
  # `enrich` job has its own internal fallbacks for a missing API key, an
  # OpenRouter error or invalid model output; this covers the case where it
  # never gets far enough to use them -- network fully down, `uv run` itself
  # failing, an unhandled exception.  Deliberately kept to `gh` alone, with
  # no script and no secrets.
  #
  # `always()` plus checking `needs.enrich.outputs.handled` (rather than
  # `needs.enrich`'s job status) means this fires both when `enrich` goes red
  # AND when it somehow succeeds without having handled anything.
  #
  # Stage 1 has already notified by the time this runs, so creating an issue
  # unconditionally means two issues for one failure. The only case that
  # genuinely needs a new issue is the notifier itself having failed, and
  # that is exactly what the absence of its marker says.
  plain-fallback:
    needs: [enrich]
    if: ${{ always() && needs.enrich.outputs.handled != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment on this run's issue, or create one (fallback)
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # The notifier ran earlier in this same run, so the run id it
          # stamped is `github.run_id`. The trailing colon matches both the
          # notifier's `:origin=` and the enricher's `:sig=`, so this also
          # covers `enrich` having applied its result and then died before
          # setting `handled`.
          #
          # Listing rather than `gh search issues` is the same read-your-writes
          # point made at locate_run_markers() in ai_failure_notifier.py: the
          # marker is seconds old and will not be indexed, and reading a stale
          # index as "no issue exists" is precisely the duplicate this avoids.
          # An issue the notifier just touched is by construction among the
          # most recently updated ones.
          marker="<!-- ai-failure-notifications:run=$RUN_ID:"
          existing=$(gh issue list --repo "$REPO" --state all --limit 30 \
            --json number,body,comments \
            -q "[.[] | select((([.body] + [.comments[].body]) | join(\"\n\")) | contains(\"$marker\")) | .number] | first // empty")

          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$REPO" \
              --body "Automated triage failed for this run, so this notice is all there is: $RUN_URL"
          else
            gh issue create \
              --repo "$REPO" \
              --title "Scheduled workflow '$WORKFLOW_NAME' failed" \
              --body "Scheduled workflow '$WORKFLOW_NAME' failed: $RUN_URL"
          fi
