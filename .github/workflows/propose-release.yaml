---
name: Propose a release

# The first of the two release workflows: work out the version, write the
# changelog, rewrite the version strings, draft the release notes, and open a
# pull request with all of it. A human reviews and merges that pull request;
# creating the release is the next workflow's job.
#
# Worth knowing:
#
# - The previous version is taken from the last tag on the branch, never from
#   ops/version.py, which only holds the post-release placeholder.
# - The pull request is opened with the workflow's own token, so its checks
#   don't start. Close and reopen it to run them.
#   TODO: open it with a GitHub App token or a PAT so the checks start on
#   their own, and drop the close-and-reopen step here, in
#   create-draft-release.yaml, and in CONTRIBUTING.md.
# - The scripts and data files in .github/ come from this workflow's own
#   commit, not from the branch being released.

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          The version to release, as X.Y.Z (or X.Y.ZrcN). Leave this empty to
          work it out from the conventional commits since the last tag.
        required: false
        type: string
      branch:
        description: The branch to release from.
        required: false
        default: main
        type: string
      dry_run:
        description: >-
          Do everything except push the branch and open the pull request. The
          proposed version, changelog and notes go in the run summary.
        required: false
        default: false
        type: boolean

permissions: {}

env:
  # The team's release tools, pinned to a commit rather than a branch: a
  # release should be reproducible, and these decide what the changelog and
  # the drafted notes say.
  CHANGELOG: >-
    git+https://github.com/canonical/charm-tech-code@9e86fcf600e094b5d7afaaf0d6096d1fdb547eae#subdirectory=changelog
  DRAFT_RELEASE_NOTES: >-
    git+https://github.com/canonical/charm-tech-code@9e86fcf600e094b5d7afaaf0d6096d1fdb547eae#subdirectory=draft-release-notes

jobs:
  propose:
    name: Propose a release
    runs-on: ubuntu-latest
    environment: release-notes  # Required to access secrets.OPENROUTER_API_KEY.
    permissions:
      contents: write  # To push the release-prep branch.
      pull-requests: write  # To open the pull request.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0  # The whole history and its tags: the release is counted from the tag.
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # This workflow's own .github/, beside the branch being released:
          # the version script and the team list are read from here.
          ref: ${{ github.sha }}
          path: release-tools
          sparse-checkout: /.github/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: false

      - name: Work out the version and the range
        id: propose
        env:
          BRANCH: ${{ inputs.branch }}
          VERSION_INPUT: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os
          import pathlib
          import re
          import subprocess
          import sys

          branch = os.environ['BRANCH']
          version_input = os.environ['VERSION_INPUT']
          changelog = os.environ['CHANGELOG']


          def run(*args, input=None):
              # stderr is left alone, so a failing command's own message is in the log.
              return subprocess.run(
                  args, input=input, stdout=subprocess.PIPE, text=True, check=True
              ).stdout


          def succeeds(*args):
              return subprocess.run(args, capture_output=True).returncode == 0


          def fail(message):
              print(f'::error::{message}')
              sys.exit(1)


          # The last tag on this branch, and not the version in ops/version.py:
          # between releases that file holds the guess the post-release bump
          # left behind, which would either skip a version or release the
          # guess. The tag is also where the changelog range starts, so the
          # two cannot drift apart.
          try:
              previous = run(
                  'git', 'describe', '--tags', '--abbrev=0',
                  '--match', '[0-9]*.[0-9]*.[0-9]*', 'HEAD',
              ).strip()
          except subprocess.CalledProcessError:
              fail(f'No release tag in the history of {branch} to count from.')
          print(f'Last tag on {branch}: {previous}')

          # One comma-separated list, from the file that explains itself. An
          # empty list is not worth failing a release over: it credits
          # everyone, which is the direction the changelog tool errs in too.
          team_file = pathlib.Path('release-tools/.github/changelog-team.txt')
          team = ','.join(
              name
              for line in team_file.read_text().splitlines()
              if (name := ''.join(line.partition('#')[0].split()))
          )

          log_format = run('uvx', '--from', changelog, 'changelog', 'git-log-format').strip()
          log = run(
              'git', 'log', '--reverse', '--no-merges', f'--format={log_format}',
              f'{previous}..HEAD',
          )
          pathlib.Path(os.environ['RUNNER_TEMP'], 'changes.log').write_text(log)

          if version_input:
              # An explicit version is used as it stands: no inference, and no
              # reconciling it against what the commits suggest. It is the
              # escape hatch for everything this workflow would otherwise
              # refuse to do, a major release among them.
              version = version_input
              if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?', version):
                  fail(f"'{version}' is not X.Y.Z or X.Y.Z{{a,b,rc}}N.")
          else:
              size = run(
                  'uvx', '--from', changelog, 'changelog', 'bump-size', '--team', team,
                  input=log,
              ).strip()
              print(f'The commits since {previous} are a {size} release.')

              # A feature or a breaking change on a maintenance branch is not
              # something to absorb into a patch release. Somebody has put it
              # on the wrong branch, and the release is not the place to find
              # that out quietly.
              if branch.endswith('-maintenance') and size != 'patch':
                  fail(
                      f'The commits since {previous} on {branch} are a {size} release:'
                      ' a feature or a breaking change has landed on a maintenance'
                      ' branch. Fix that, or pass an explicit version if this is really'
                      ' intended.'
                  )

              version = run(
                  'uvx', '--from', changelog, 'changelog', 'next-version',
                  '--previous', previous, '--team', team,
                  input=log,
              ).strip()

          if succeeds('git', 'rev-parse', '-q', '--verify', f'refs/tags/{version}'):
              # Worked out from the commits, the version can only be taken if
              # the tag is somewhere this branch can't see: 3.8.3 was released
              # from 3.8-maintenance, so on main the last tag was still 3.8.2
              # and a patch release came out as 3.8.3 again. Which version main
              # should release next is a person's call, not the commits'.
              if version_input:
                  fail(f'{version} is already tagged.')
              fail(
                  f'The commits since {previous} make this {version}, but {version} is'
                  f" already tagged outside {branch}'s history (it was probably"
                  ' released from a maintenance branch). Run this again with an explicit'
                  ' version.'
              )

          # Checked here rather than at the push, so that a leftover branch
          # from an abandoned attempt costs nothing: everything after this
          # step rewrites files and spends a model call. A dry run never
          # pushes, so a leftover branch is no obstacle to one.
          head_ref = f"repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/release-prep-{version}"
          if os.environ['DRY_RUN'] != 'true' and succeeds('gh', 'api', head_ref):
              fail(
                  f'A release-prep-{version} branch already exists. Delete it, or'
                  f' finish the pull request that goes with it, before proposing'
                  f' {version} again.'
              )

          count = run('git', 'rev-list', '--count', f'{previous}..HEAD').strip()
          print(f'Releasing {version}, from the {count} commits since {previous}.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'previous={previous}\nversion={version}\nteam={team}\n')

      - name: Generate the changelog entry
        env:
          VERSION: ${{ steps.propose.outputs.version }}
          TEAM: ${{ steps.propose.outputs.team }}
        run: |
          set -euo pipefail
          uvx --from "$CHANGELOG" changelog changes-entry \
            --repo "$GITHUB_REPOSITORY" --tag "$VERSION" --team "$TEAM" \
            < "$RUNNER_TEMP/changes.log" > "$RUNNER_TEMP/changes-entry.md"
          cat "$RUNNER_TEMP/changes-entry.md" CHANGES.md > "$RUNNER_TEMP/CHANGES.md"
          mv "$RUNNER_TEMP/CHANGES.md" CHANGES.md
          cat "$RUNNER_TEMP/changes-entry.md"  # For the log, even if a later step fails.

      - name: Update the version files
        env:
          VERSION: ${{ steps.propose.outputs.version }}
        run: |
          set -euo pipefail
          python3 release-tools/.github/update-release-versions.py --version "$VERSION"
          uv lock
          git --no-pager diff --stat

      # The exemplars in .github/release-note-exemplars.md are chosen for how
      # they read rather than for being the most recent: 2.23.4 for a fixes
      # release, 3.8.1 for features and polish, 3.8.2 for a release that says
      # it is routine and stops. Replace one when a release beats it. Each is
      # headed with the release's title, so the model sees how our titles read
      # as well as our notes.
      - name: Draft the release notes
        env:
          VERSION: ${{ steps.propose.outputs.version }}
          PREVIOUS: ${{ steps.propose.outputs.previous }}
          BRANCH: ${{ inputs.branch }}
          # The model is a repository variable rather than something pinned
          # here, so that changing it is a settings edit and not a pull
          # request. Neither it nor the key existing is required: without
          # them the notes are a placeholder for the reviewer to fill in.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          set -euo pipefail
          uvx --from "$DRAFT_RELEASE_NOTES" draft-release-notes \
            --repo "$GITHUB_REPOSITORY" \
            --version "$VERSION" \
            --previous "$PREVIOUS" \
            --branch "$BRANCH" \
            --changelog "$RUNNER_TEMP/changes-entry.md" \
            --exemplars release-tools/.github/release-note-exemplars.md \
            --compare-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$PREVIOUS...$VERSION" \
            --output "$RUNNER_TEMP/release-notes.md" \
            --title-output "$RUNNER_TEMP/release-title.md"

      - name: Write the pull request description and the run summary
        env:
          VERSION: ${{ steps.propose.outputs.version }}
          PREVIOUS: ${{ steps.propose.outputs.previous }}
          BRANCH: ${{ inputs.branch }}
        shell: python
        run: |
          import os
          import pathlib

          version = os.environ['VERSION']
          previous = os.environ['PREVIOUS']
          branch = os.environ['BRANCH']
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          repo_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
          title = (temp / 'release-title.md').read_text()
          notes = (temp / 'release-notes.md').read_text()
          changes_entry = (temp / 'changes-entry.md').read_text()
          # The markers are how the next workflow lifts the title's summary and
          # the notes back out of this description when it creates the draft
          # release, so anything written outside them is for reviewers and
          # goes no further. They are HTML comments, which a reader of the
          # pull request doesn't see, so each pair also gets a visible heading
          # just outside it.
          instructions = (
              f'The GitHub release is titled `{version}: ` followed by the summary under'
              ' "Release title", and its body is the notes under "Release notes".'
              ' Edit both here: this description is where they are read from.'
              ' Each is wrapped in hidden markers, which you will see when you edit;'
              ' keep them.'
          )
          body = f"""\
          Prepares the {version} release from `{branch}`.

          * `CHANGES.md` has a new entry for {version}.
          * The version strings are updated across ops, ops-scenario, ops-tracing and the tool-versions table.
          * [Commits since {previous}]({repo_url}/compare/{previous}...{branch})

          {instructions}

          ## Release title

          <!-- release-title:start -->

          {title}
          <!-- release-title:end -->

          ## Release notes

          <!-- release-notes:start -->

          {notes}
          <!-- release-notes:end -->
          """
          (temp / 'pr-body.md').write_text(body)

          summary = f"""\
          ## {version}, from `{branch}`

          Counted from the last tag on the branch, `{previous}`.

          <details><summary>Changelog entry</summary>

          {changes_entry}
          </details>

          ### Draft release title

          {version}: {title}
          ### Draft release notes

          {notes}"""
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(summary)

      - name: Commit, push, and open the pull request
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.propose.outputs.version }}
          BRANCH: ${{ inputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_branch="release-prep-$VERSION"

          git config user.name 'Prints Charming [bot]'
          git config user.email 'ben.hoyt+prints-charming-bot@canonical.com'
          git switch -c "$head_branch"
          # Every tracked file the steps above changed, and nothing else: the
          # release-tools checkout is untracked, so it stays out.
          git add -u
          git commit -m "chore: prepare release $VERSION"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" \
            "HEAD:refs/heads/$head_branch"

          url=$(gh pr create --repo "$GITHUB_REPOSITORY" \
            --base "$BRANCH" --head "$head_branch" \
            --title "chore: update changelog and versions for $VERSION release" \
            --body-file "$RUNNER_TEMP/pr-body.md")
          echo "Opened $url"
          printf '\n### Pull request\n\n%s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
