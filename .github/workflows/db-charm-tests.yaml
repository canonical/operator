name: Data Charm Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  build-wheels:
    uses: $/.github/workflows/_build-wheels.yaml

  db-charm-tests:
    runs-on: ubuntu-latest
    needs: build-wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - charm-repo: canonical/postgresql-operator
            charm-root: .
            commit: 478031a2a4a30f8c2efe6c9277c6a01b36627bde  # 2026-11-18T01:38:29Z
          - charm-repo: canonical/postgresql-k8s-operator
            charm-root: .
            commit: beea7cd5e3e0c5a7717b56aaae9b54b01f6b5d4c  # 2026-11-14T03:45:39Z
          - charm-repo: canonical/mysql-operators
            charm-root: machines
            commit: c39042d6b2a5046663a658c2db31d3c7bcf7141b  # v8.4/1.125.0 2026-11-24T14:53:58Z
          - charm-repo: canonical/mysql-operators
            charm-root: kubernetes
            commit: c39042d6b2a5046663a658c2db31d3c7bcf7141b  # v8.4/1.125.0 2026-11-24T14:53:58Z
    steps:
      - name: Checkout the ${{ matrix.charm-repo }} repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ matrix.charm-repo }}
          path: charm-repo
          persist-credentials: false
          ref: ${{ matrix.commit }}

      - name: Download operator wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.build-wheels.outputs.artifact-name }}
          path: operator-wheels

      - name: Install patch dependencies
        run: pip install poetry~=2.0

      - name: Update 'ops' dependency in test charm to latest
        working-directory: charm-repo/${{ matrix.charm-root }}
        run: |
          ops_wheel="$(ls "$GITHUB_WORKSPACE"/operator-wheels/ops-[0-9]*.whl)"
          ops_tracing_wheel="$(ls "$GITHUB_WORKSPACE"/operator-wheels/ops_tracing-*.whl)"
          if [ -e "requirements.txt" ]; then
            sed -i -e "/^ops[ ><=]/d" -e "/canonical\/operator/d" -e "/#egg=ops/d" requirements.txt
            echo -e "\n${ops_wheel}" >> requirements.txt
          else
            # The charm may declare ops with the 'tracing' extra, which pulls in
            # ops-tracing from PyPI. Replacing ops with a local wheel drops the
            # extra, so install the matching ops-tracing wheel explicitly when
            # the charm asked for it. Check before `poetry remove`, which
            # strips the ops line from pyproject.toml.
            if grep -qE 'ops[^a-z]+=.*tracing|ops\[[^]]*tracing' pyproject.toml; then
              wants_tracing=1
            else
              wants_tracing=0
            fi
            poetry remove ops --lock
            if [ "${wants_tracing}" = "1" ]; then
              poetry add "${ops_wheel}" "${ops_tracing_wheel}" --lock
            else
              poetry add "${ops_wheel}" --lock
            fi
          fi

      - name: Install dependencies
        run: pip install tox~=4.2

      - name: Run the charm's unit tests
        working-directory: charm-repo/${{ matrix.charm-root }}
        run: tox -vve unit
