name: ops Smoke Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '1 7 25 * *'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        juju-channel: ['2.9/stable', '3/stable', '4/stable']
        preset: ['machine', 'microk8s']
    continue-on-error: ${{ matrix.juju-channel == '4/stable' && matrix.preset == 'microk8s' }}

    steps:
      - run: sudo snap install --classic concierge
      - run: >
          sudo concierge prepare
          --juju-channel=${{ matrix.juju-channel }}
          --charmcraft-channel=3.x/stable
          -p "${{ matrix.preset }}"
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - run: uv tool install tox --with tox-uv

      - name: Run smoke tests
        run: tox -e smoke
        timeout-minutes: 20  # Juju 4 gets stuck while destroying the test model

      - name: Archive charmcraft logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: charmcraft-logs
          path: /home/runner/.local/state/charmcraft/log/*.log

  open-issue-on-failure-if-scheduled:
    if: ${{ failure() && github.event_name == 'schedule' }}
    needs: [test]
    permissions:
      issues: write
      # Stage 2 reads this run's job logs, and a called workflow cannot hold
      # a scope its caller withheld, so `actions: read` has to be granted
      # here even though nothing in this file uses it.
      actions: read
    # This passes an empty string, and is still required. The OpenRouter key
    # lives on stage 2's `ai-failure-triage` environment, which no job here
    # can read, but unless each call site names the secret, stage 2's own
    # environment does not fill it in either and enrichment quietly degrades
    # to a plain notice.
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    uses: ./.github/workflows/notify-scheduled-failure.yaml
