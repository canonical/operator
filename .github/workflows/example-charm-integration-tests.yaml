name: Example Charm Integration Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '50 15 * * 2'  # 15:50 UTC Tuesdays

permissions: {}

jobs:
  # Pack & run integration tests for machine charms.
  machine-examples-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - examples/machine-tinyproxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Set up tox and tox-uv
        run: uv tool install tox --with tox-uv
      - name: Install Concierge
        run: sudo snap install --classic concierge
      - name: Prepare for deploying machine charms
        run: sudo concierge prepare -p machine
      - name: Pack charm
        run: |
          cd ${{ matrix.dir }}
          charmcraft pack
      - name: Run integration tests
        run: |
          cd ${{ matrix.dir }}
          tox -e integration

  # Pack & run integration tests for K8s charms.
  k8s-examples-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          # httpbin-demo runs under example-charm-charmcraft-test.yaml instead.
          - examples/k8s-1-minimal
          - examples/k8s-2-configurable
          - examples/k8s-3-postgresql
          - examples/k8s-4-action
          - examples/k8s-5-observe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Set up tox and tox-uv
        run: uv tool install tox --with tox-uv
      - name: Install Concierge
        run: sudo snap install --classic concierge
      - name: Prepare for deploying K8s charms
        # .github/integration/concierge-k8s.yaml mirrors the upstream concierge
        # k8s preset and adds juju.extra-bootstrap-args: `juju bootstrap`
        # regularly fails on slow GHA runners with `unable to contact api server
        # after 60 attempts` because the default --bootstrap-timeout is too short.
        run: sudo concierge prepare -c .github/integration/concierge-k8s.yaml
      - name: Fetch any charmlibs
        run: |
          cd ${{ matrix.dir }}
          if grep -Eq "^charm-libs:" charmcraft.yaml; then
            charmcraft fetch-libs
          fi
      - name: Pack charm
        run: |
          cd ${{ matrix.dir }}
          charmcraft pack
      - name: Run integration tests
        run: |
          cd ${{ matrix.dir }}
          tox -e integration

  open-issue-on-failure-if-scheduled:
    if: ${{ failure() && github.event_name == 'schedule' }}
    needs: [machine-examples-integration, k8s-examples-integration]
    permissions:
      issues: write
    uses: ./.github/workflows/notify-scheduled-failure.yaml
