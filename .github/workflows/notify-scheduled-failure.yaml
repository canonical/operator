name: Notify on scheduled failure

# Reusable workflow: opens (or comments on) an issue when a scheduled
# workflow fails. Callers gate the invocation with
# `if: failure() && github.event_name == 'schedule'` and pass
# `permissions: issues: write` plus `actions: read`, and pass
# `OPENROUTER_API_KEY` through. The last two are for stage 2, which this
# workflow calls in turn: a called workflow holds no scope its caller
# withheld, and cannot use a secret no call site named.
#
# This is the first of two stages: a cheap, deterministic, always-works
# dedup pre-check, with no LLM dependency and no secrets. The `open-issue`
# job below is the whole of that guarantee -- once it has run, a
# notification exists. The second stage,
# .github/workflows/ai-failure-enrich.yaml, is called afterwards from here
# and rewrites what this one produced into a triaged artefact. It needs an
# API key and an environment, and if it is unprovisioned or broken the
# notification has already happened regardless.

on:
  workflow_call:
    secrets:
      # Passed straight through to stage 2, which is the only thing that
      # uses it. See the comment at the call below.
      OPENROUTER_API_KEY:
        required: false

jobs:
  open-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or comment on issue, deduping coarsely by workflow name
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.workflow }}  # The workflow that called this one.
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- ai-failure-notifications:run=$RUN_ID:origin="

          # Match on the workflow name alone, not the full placeholder
          # sentence: the enricher rewrites title and body, but always
          # preserves a "Workflow: <name>" footer line specifically so this
          # search keeps working after enrichment. Deliberately not an
          # `in:title` search either -- on a corpus of past scheduled
          # failures, issues that a human had retitled kept the workflow name
          # in the body but had lost it from the title.
          match=$(gh issue list --repo "$REPO" --state open \
            --search "\"$WORKFLOW_NAME\"" \
            --json number --limit 1 -q '.[0].number // empty')

          if [[ -n "$match" ]]; then
            comment_body="Scheduled workflow '$WORKFLOW_NAME' failed again: $RUN_URL"$'\n\n'"${marker}comment -->"
            gh issue comment "$match" --repo "$REPO" --body "$comment_body"
          else
            issue_body="Scheduled workflow '$WORKFLOW_NAME' failed: $RUN_URL"$'\n\n'"${marker}new -->"
            gh issue create --repo "$REPO" \
              --title "Scheduled workflow '$WORKFLOW_NAME' failed" \
              --body "$issue_body"
          fi

  # Stage 2. Called from here, rather than subscribing to this workflow's
  # callers with `workflow_run`, so that there is no list of caller workflow
  # names to keep in sync -- renaming a scheduled workflow would silently
  # have stopped enrichment -- and no `dangerous-triggers` suppression to
  # justify.
  #
  # That trade is not free. `workflow_run` would give stage 2 an independent
  # run, where `environment:` delivers its own secrets and no caller needs
  # touching; calling it from here means the OpenRouter key has to be
  # inherited down the chain instead, which is a `secrets-inherit`
  # suppression in each of the seven callers and hands stage 2 every secret
  # its caller can see rather than just the one it needs.
  #
  # `needs: [open-issue]` is what orders it after the placeholder exists;
  # `always()` runs it even if stage 1 failed, since the enricher's own
  # fallback handles a missing marker by creating the issue itself.
  enrich:
    needs: [open-issue]
    if: ${{ always() }}
    permissions:
      issues: write
      # A called workflow cannot hold a scope its caller did not grant, so
      # `actions: read` has to be repeated at every level of the chain for
      # the enricher's log fetch to have it.
      actions: read
    # This passes an empty string, and is still required. Nothing in this
    # chain can read the OpenRouter key: it lives on stage 2's
    # `ai-failure-triage` environment, and only the job declaring that
    # environment resolves it. But unless the secret is named at each call
    # site, stage 2's own environment does not fill it in either, and
    # enrichment degrades to a plain notice with nothing failing loudly.
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    uses: ./.github/workflows/ai-failure-enrich.yaml

  # If stage 1 failed *and* the enricher never got far enough to use its own
  # fallback, nothing has notified anyone -- the one case here that needs an
  # issue created. An un-enriched placeholder is a red job, not a lost
  # notification, so `enrich` failing on its own is deliberately left alone.
  # Both stages run in this same run, so `needs.*.result` says directly
  # whether a notification exists; no marker search is needed to find out.
  plain-fallback:
    needs: [open-issue, enrich]
    if: >-
      ${{ always() && needs.open-issue.result != 'success' &&
      needs.enrich.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create an issue (last resort)
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue create --repo "$REPO" \
            --title "Scheduled workflow '$WORKFLOW_NAME' failed" \
            --body "Scheduled workflow '$WORKFLOW_NAME' failed: $RUN_URL"
