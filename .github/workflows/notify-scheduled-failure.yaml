name: Notify on scheduled failure

# Reusable workflow: opens (or comments on) an issue when a scheduled
# workflow fails. Callers gate the invocation with
# `if: failure() && github.event_name == 'schedule'` and pass
# `permissions: issues: write` plus `actions: read`, and pass
# `OPENROUTER_API_KEY` through. The last two are for stage 2, which this
# workflow calls in turn: a called workflow holds no scope its caller
# withheld, and cannot use a secret no call site named.
#
# This is the first of two stages: a cheap, deterministic, always-works
# dedup pre-check, with no LLM dependency and no secrets. The `notify`
# job below is the whole of that guarantee -- once it has run, a
# notification exists. The second stage,
# .github/workflows/ai-failure-enrich.yaml, is called afterwards from here
# and rewrites what this one produced into a triaged artefact. It needs an
# API key and an environment, and if it is unprovisioned or broken the
# notification has already happened regardless.

on:
  workflow_call:
    secrets:
      # For ai-failure-enrich.yaml -- can only be read in the ai-failure-triage environment.
      OPENROUTER_API_KEY:
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    # Handed to `enrich` below, so that stage 2 is told which artefact to
    # upgrade instead of searching for the marker this job just stamped.
    # GitHub's issue search index is not read-your-writes, so that search
    # could miss a marker written seconds earlier and open a second issue for
    # a run that already has one.
    outputs:
      issue: ${{ steps.notify.outputs.issue }}
      origin: ${{ steps.notify.outputs.origin }}
    steps:
      - name: Create or comment on issue, deduping coarsely by workflow name
        id: notify
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.workflow }}  # The workflow that called this one.
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- ai-failure-notifications:run=$RUN_ID:origin="

          # Search for the workflow name in issue bodies or titles.
          match=$(gh issue list --repo "$REPO" --state open \
            --search "\"$WORKFLOW_NAME\"" \
            --json number --limit 1 -q '.[0].number // empty')

          if [[ -n "$match" ]]; then
            comment_body="Scheduled workflow '$WORKFLOW_NAME' failed again: $RUN_URL"$'\n\n'"${marker}comment -->"
            gh issue comment "$match" --repo "$REPO" --body "$comment_body"
            echo "issue=$match" >> "$GITHUB_OUTPUT"
            echo "origin=comment" >> "$GITHUB_OUTPUT"
          else
            issue_body="Scheduled workflow '$WORKFLOW_NAME' failed: $RUN_URL"$'\n\n'"${marker}new -->"
            # `gh issue create` prints the new issue's URL; the number is its
            # last path segment.
            issue_url=$(gh issue create --repo "$REPO" \
              --title "Scheduled workflow '$WORKFLOW_NAME' failed" \
              --body "$issue_body")
            echo "issue=${issue_url##*/}" >> "$GITHUB_OUTPUT"
            echo "origin=new" >> "$GITHUB_OUTPUT"
          fi

  enrich:
    needs: [notify]
    permissions:
      issues: write
      actions: read
    # Passes an empty string, and is still required -- see the note on
    # OPENROUTER_API_KEY in ai-failure-enrich.yaml.
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    # `notify` has to have succeeded to get here, so these are always set for
    # this repo. The script keeps a lookup fallback for the empty case anyway:
    # other repositories adopt this at their own pace, and a caller that has
    # not been migrated yet passes nothing.
    with:
      issue: ${{ needs.notify.outputs.issue }}
      origin: ${{ needs.notify.outputs.origin }}
    uses: ./.github/workflows/ai-failure-enrich.yaml
