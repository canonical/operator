---
name: Create the draft release

# The second of the two release workflows: turn the merge of the version-bump
# pull request into a draft GitHub release, titled with the version and the
# summary from that pull request's description, whose body is the release
# notes from the same description followed by this version's section of
# CHANGES.md and a link comparing it with the previous release. Then open the
# pull request that puts the branch back onto a development version.
#
# Five things are worth knowing before reading the steps:
#
# - This runs on pull_request_target rather than on push because that event
#   always takes the workflow file from the default branch, whichever branch
#   the pull request was merged into. A push takes it from the branch that was
#   pushed to, so a maintenance branch would need its own copy of this file
#   and of everything it reads out of .github/. With this, releasing from a
#   maintenance branch needs nothing on that branch but the version files.
# - pull_request_target runs with a write token, which is why it has a
#   reputation. Nothing here executes code from the checkout: the merged tree
#   is read as data (the version, CHANGES.md), and the version script comes
#   from this workflow's own commit on the default branch. It also only acts
#   on a pull request that has been merged, so the tree it reads is one a
#   maintainer has already accepted.
# - The release is a draft, and that is the design rather than a caution to
#   be lifted later. Publishing it is the second of this pipeline's two
#   human gates: the pull request review reads the diff, and the draft is
#   where somebody reads the notes as a reader will see them. There is no
#   auto-publish path here and no input for one.
# - A draft release does not create its tag. Nothing here tags anything. The
#   tag appears, against the squash commit of the merged pull request, when a
#   human publishes the draft. Because the draft is pinned to that commit,
#   the post-release bump can be opened, and even merged, before the draft is
#   published without changing what gets released.
# - Almost every merge is not a release. The path filter keeps most of them
#   from starting a run at all, and the first step exits quietly on the rest -
#   the post-release .dev0 bump among them.
#
# If a job fails on a merge that really was a release - a description whose
# markers somebody removed, say - fix the cause and re-run the failed job. A
# pull request description can still be edited after the merge, and every
# step reads what it needs fresh from the branch or the API.

"on":
  pull_request_target:  # zizmor: ignore[dangerous-triggers] -- see the comment above.
    types: [closed]
    branches:
      - main
      - '*-maintenance'  # A glob: a list would go stale the next time a branch is cut.
    paths:
      # Every release changes this file, and nearly nothing else does, so
      # most merges never start a run at all.
      - ops/version.py

permissions: {}

env:
  # The team's release tools, pinned to a commit rather than a branch.
  CHANGELOG: >-
    git+https://github.com/canonical/charm-tech-code@9e86fcf600e094b5d7afaaf0d6096d1fdb547eae#subdirectory=changelog

# One release at a time per branch. Two runs of this would race to create
# the same release, and the loser's error would be the confusing one.
concurrency:
  group: create-draft-release-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Create the draft release
    if: ${{ github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # To create the draft release.
      pull-requests: read  # To read the merged pull request's description.
    outputs:
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # The squash commit the merge made, which is the release. Its parent
          # is the branch before the merge, which is what the version is
          # compared against, and the tags are where the compare link starts.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false

      - name: Is this merge a release?
        id: detect
        run: |
          set -euo pipefail

          version_in() { sed -n "s/^version: str = '\(.*\)'$/\1/p"; }

          after=$(version_in < ops/version.py)
          if [ -z "$after" ]; then
            echo "::error::ops/version.py has no \`version: str = '...'\` line to read."
            exit 1
          fi

          # The repository only squash merges, so the first parent is the
          # branch as it was before this pull request. An empty --before
          # means "not a release", which is the right answer for a branch
          # that had no version file before.
          before=''
          if git cat-file -e "HEAD^1:ops/version.py" 2>/dev/null; then
            before=$(git show "HEAD^1:ops/version.py" | version_in)
          fi

          uvx --from "$CHANGELOG" changelog detect-release --before "$before" --after "$after" \
            >> "$GITHUB_OUTPUT"

      - name: Read the merged pull request's description
        if: ${{ steps.detect.outputs.version }}
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Fresh from the API rather than from the event, so that a re-run
          # after somebody fixed the description picks up the fix.
          echo "The release notes come from #$NUMBER."
          gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
            > "$RUNNER_TEMP/pr-description.md"

      - name: Assemble the release title and body
        id: assemble
        if: ${{ steps.detect.outputs.version }}
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail

          # The previous release is the last tag in this commit's history:
          # this version's own tag doesn't exist until the draft is published.
          # Without one the body just has no compare link at the end.
          compare=()
          if previous=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' HEAD); then
            compare=(--compare-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous...$VERSION")
          else
            echo "::warning::No earlier release tag to compare $VERSION with; the body has no Full Changelog link."
          fi
          uvx --from "$CHANGELOG" changelog release-body --version "$VERSION" --changes CHANGES.md \
            "${compare[@]}" < "$RUNNER_TEMP/pr-description.md" > "$RUNNER_TEMP/release-body.md"

          # Never fails: with no summary to use, the title is the bare version,
          # and the reason goes to the log.
          title=$(uvx --from "$CHANGELOG" changelog release-title --version "$VERSION" \
            < "$RUNNER_TEMP/pr-description.md")
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        id: release
        if: ${{ steps.detect.outputs.version }}
        env:
          VERSION: ${{ steps.detect.outputs.version }}
          TITLE: ${{ steps.assemble.outputs.title }}
          PRERELEASE: ${{ steps.detect.outputs.prerelease }}
          TARGET: ${{ github.event.pull_request.merge_commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Checked here for the sake of the message: `gh release create`
          # would fail on its own, but a re-run of this workflow after the
          # release was already made is worth naming as such.
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::There is already a release for $VERSION. If it needs to be rebuilt," \
              "delete it first; if it is already published, there is nothing to do here."
            exit 1
          fi

          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags=(--prerelease)
          fi

          # --draft is the point of this workflow, and --notes-file is what
          # keeps GitHub from generating a second, differently grouped
          # changelog underneath ours. The tag named here does not exist and
          # is not created: GitHub creates it against --target when somebody
          # publishes the draft. The target is the merge's own commit rather
          # than the branch, so that nothing merged after it can ride along.
          url=$(gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --draft --target "$TARGET" --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/release-body.md" "${flags[@]}")
          echo "Drafted $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summarise the draft
        if: ${{ steps.detect.outputs.version }}
        env:
          VERSION: ${{ steps.detect.outputs.version }}
          TITLE: ${{ steps.assemble.outputs.title }}
          NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ steps.release.outputs.url }}
        run: |
          set -euo pipefail
          {
            printf '## Draft release: %s\n\n' "$TITLE"
            printf '%s\n\n' "$URL"
            printf 'Title and notes from #%s, changelog from `CHANGES.md`. Nothing is published' \
              "$NUMBER"
            printf ' and the'
            printf ' `%s` tag does not exist yet: publishing the draft is a human step, and it' \
              "$VERSION"
            printf ' is what creates the tag.\n\n'
            printf '<details><summary>Release body</summary>\n\n'
            cat "$RUNNER_TEMP/release-body.md"
            printf '\n</details>\n'
          } >> "$GITHUB_STEP_SUMMARY"

  bump:
    name: Open the post-release pull request
    # A job of its own, so that re-running it after a failure doesn't try to
    # create the draft a second time.
    #
    # The pull request is opened with the workflow's own token, so GitHub
    # will not start the usual checks on it: close and reopen it to get them
    # to run. TODO: use a GitHub App token (or the bot account's PAT) here, as
    # for propose-release.yaml.
    needs: draft
    if: ${{ needs.draft.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # To push the post-release branch.
      pull-requests: write  # To open the pull request.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # The tip of the release branch rather than the release commit: the
          # branch may have moved on since, and the bump belongs on top of
          # wherever it is now.
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # The version script, from the default branch, which is where this
          # workflow runs from. A maintenance branch doesn't have to carry it.
          ref: ${{ github.sha }}
          path: release-tools
          sparse-checkout: /.github/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false

      - name: Work out the next version
        id: bump
        env:
          RELEASED: ${{ needs.draft.outputs.version }}
          BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # The branch is known, since it is the one the pull request was
          # merged into, so it goes in as both the target and the only
          # candidate, and all this asks the tool for is the version.
          uvx --from "$CHANGELOG" changelog post-release --tag "$RELEASED" --target "$BRANCH" \
            --candidates "$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Start the post-release branch
        id: branch
        env:
          RELEASED: ${{ needs.draft.outputs.version }}
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_branch="post-release-$RELEASED"

          # A re-run after the pull request was merged, or after somebody did
          # the bump by hand. Nothing to do, and nothing to complain about.
          if grep -q "^version: str = '$VERSION'\$" ops/version.py; then
            echo "$BRANCH is already at $VERSION, so there is no bump to open."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Checked before anything is rewritten, so that a leftover branch
          # from an abandoned attempt is a message rather than a push that
          # fails at the end.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$head_branch" >/dev/null 2>&1; then
            echo "::error::A $head_branch branch already exists. Merge or close the pull" \
              "request that goes with it, or delete the branch, and re-run this job."
            exit 1
          fi

          git switch -c "$head_branch"
          echo "head-branch=$head_branch" >> "$GITHUB_OUTPUT"

      - name: Update the version files
        if: ${{ !steps.branch.outputs.skip }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          python3 release-tools/.github/update-release-versions.py --version "$VERSION" \
            --post-release
          uv lock
          git --no-pager diff --stat

      - name: Commit, push, and open the pull request
        id: pull-request
        if: ${{ !steps.branch.outputs.skip }}
        env:
          RELEASED: ${{ needs.draft.outputs.version }}
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ steps.branch.outputs.head-branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name 'Prints Charming [bot]'
          git config user.email 'ben.hoyt+prints-charming-bot@canonical.com'
          # Every tracked file the script and `uv lock` changed, and nothing
          # else: the release-tools checkout is untracked, so it stays out.
          git add -u
          git commit -m "chore: update versions after the $RELEASED release"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" \
            "HEAD:refs/heads/$HEAD_BRANCH"

          {
            printf '%s is drafted, so `%s` goes back to a development version.\n\n' \
              "$RELEASED" "$BRANCH"
            printf '* `ops` and `ops-tracing` go to `%s`, and `ops-scenario` follows it.\n' \
              "$VERSION"
            printf '* The tool-versions table is left alone: it records releases, and this'
            printf ' is not one.\n\n'
            printf 'This is safe to merge before the draft release is published: the draft'
            printf ' is pinned to the commit that was reviewed, not to the branch.\n\n'
            printf 'The version here is a placeholder that stops the tree claiming to be'
            printf ' %s. Nothing counts from it - the next release is counted from the' "$RELEASED"
            printf ' last tag on the branch - so it does not matter if the next release'
            printf ' turns out to be a different one.\n'
          } > "$RUNNER_TEMP/pr-body.md"

          url=$(gh pr create --repo "$GITHUB_REPOSITORY" \
            --base "$BRANCH" --head "$HEAD_BRANCH" \
            --title "chore: adjust versions after the $RELEASED release" \
            --body-file "$RUNNER_TEMP/pr-body.md")
          echo "Opened $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summarise the bump
        env:
          BRANCH: ${{ github.event.pull_request.base.ref }}
          VERSION: ${{ steps.bump.outputs.version }}
          SKIP: ${{ steps.branch.outputs.skip }}
          URL: ${{ steps.pull-request.outputs.url }}
        run: |
          set -euo pipefail
          {
            printf '## Post-release bump\n\n'
            if [ -n "$SKIP" ]; then
              printf '`%s` is already at `%s`. Nothing to do.\n' "$BRANCH" "$VERSION"
            else
              printf '`%s` goes to `%s`.\n\n%s\n' "$BRANCH" "$VERSION" "$URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
