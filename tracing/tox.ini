[tox]
requires = tox>=4.2
env_list = lint, unit
skip_missing_interpreters = true

[testenv]
runner = uv-venv-lock-runner
setenv =
  PY_COLORS=1
passenv =
  HOME
  PATH
  SCENARIO_SKIP_CONSISTENCY_CHECKS
  SCENARIO_BARE_CHARM_ERRORS


[testenv:py{3.10,3.12,3.14}-unit]
# runner must be re-specified here due to tox environment inheritance shenanigans
runner = uv-venv-lock-runner
base = unit

[testenv:unit]
dependency_groups = unit
commands = pytest --ignore=test/test_upstream_schemas.py {posargs}

[testenv:upstream-schemas]
description =
    Drift check: compare our de-pydantic'd dataclasses against the upstream
    canonical/charmlibs schemas. Opt-in (requires network + pydantic);
    not part of the default ``unit`` run.
# Deliberately NOT on the uv-venv-lock-runner the other envs inherit: this env
# needs pydantic, and the lock runner installs only what `uv.lock` resolves.
# Adding pydantic to a dependency group would put it back in `uv.lock` for
# ops-tracing — exactly what this branch removes — so the drift check keeps its
# own virtualenv and its own `deps`.
runner = virtualenv
deps =
    pytest
    pydantic
    -e ..
    -e ../testing
commands = pytest test/test_upstream_schemas.py {posargs}

[testenv:lint]
description = Check code against coding style standards
dependency_groups = lint, unit
commands =
    ruff check --preview
    ruff format --preview --check
    codespell
    pyright {posargs}

[testenv:format]
dependency_groups = lint
commands =
    ruff format --preview {toxinidir}
